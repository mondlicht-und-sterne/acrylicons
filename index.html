<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acrylicons – Linux Icon Theme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap');
:root{--bg:#e8e4de;--paper:#faf8f6;--ink:#2a221c;--line:#d6d0c8;--code:#1e1a16}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.6}
h1,h2{font-family:Fraunces,serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;padding:8px 0 48px}
.hero{text-align:center}
.hero h1{font-size:68px;letter-spacing:-.04em}
.btn{border:1.2px solid var(--ink);border-radius:999px;padding:11px 20px;display:inline-flex;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;max-width:780px;margin:36px auto}
.ic{aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:22px;display:grid;place-items:center}
</style>
</head>
<body>
<div class="wrap">
<header><div>◐ acrylicons</div><nav>Docs Install Download</nav></header>
<section class="hero">
<h1>Acrylicons</h1>
<p>Minimal acrylic icon theme for Linux</p>
</section>
<div class="grid6"><div class="ic">🏠</div><div class="ic">👤</div><div class="ic">⚙️</div><div class="ic">📁</div><div class="ic">💙</div><div class="ic">🗃️</div></div>
